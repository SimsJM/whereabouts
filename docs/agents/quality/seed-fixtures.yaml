# Scripted inputs used by the prototype (use as recorded fakes):
voice_fakes:
  - transcript: "Three extension leads, a cordless sander and a box of wall plugs"
    parsed: [{name: "Extension lead", category: Electrical, quantity: 3}, {name: "Cordless sander", category: "Power tools", quantity: 1}, {name: "Wall plugs (box)", category: Fixings, quantity: 1, duplicate_of: i7}]
  - transcript: "Six wine glasses, the cafetière and two baking trays"
    parsed: [{name: "Wine glasses", category: Kitchen, quantity: 6}, {name: "Cafetière", category: Kitchen, quantity: 1}, {name: "Baking tray", category: Kitchen, quantity: 2}]
  - transcript: "allen keys"   # voice search

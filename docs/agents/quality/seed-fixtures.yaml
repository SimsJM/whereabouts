# Whereabouts seed fixtures v1.0 (31 Oct 2026)
# Mirrors the clickable prototype's sample household. Shared by e2e regression and per-PR previews (SEED_FIXTURES=demo).
# IDs are fixture keys, not database IDs. Codes are real and must be preserved.
# code_counters after load: B -> 63 (B-0062 is the highest), P -> 10. NOTE: the prototype's nextCode() only looks at the max B code; real allocation uses code_counters.


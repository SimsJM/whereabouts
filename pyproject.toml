[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whereabouts"
version = "0.1.0"
description = "Whereabouts: know where everything in your household is stored."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/whereabouts"]

[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = ["E", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; }
        .hero { text-align: center; padding: 3rem 0; }
        .badge { display: inline-block; background: #e5e7eb; color: #374151; padding: 0.5rem 1rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 500; margin-bottom: 1rem; }
        h1 { font-size: 3rem; margin-bottom: 1rem; }
        .lead { font-size: 1.25rem; color: #6b7280; }
    </style>
</head>
<body>
    <main class="hero">
        {{ if .Params.hero_badge }}
        <div class="badge">{{ .Params.hero_badge }}</div>
        {{ end }}
        <h1>{{ .Title }}</h1>
        {{ .Content }}
    </main>
</body>
</html>
